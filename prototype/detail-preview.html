<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Selector — detail modal preview</title>
<!-- Standalone mock of the end-user detail modal added to task-selector-widget.ts.
     Same markup/CSS as the real widget. Click a task to open the detail. -->
<style>
  :root{--primary:#da2e32;--primary-rgb:218,46,50;--primary-text:#fff;--dark:#1A1A1A;--gray:#6b7280;--gray-lt:#9ca3af;
    --border:#e5e7eb;--success:#2E7D4A;--error:#C41E3A;--r-sm:6px;--r-md:10px;--r-lg:14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f4f5f7;padding:20px;color:var(--dark);}
  .tsw{max-width:520px;margin:0 auto;background:transparent;padding:16px;}
  .tsw-title{font-size:16px;font-weight:800;margin-bottom:2px;}
  .tsw-count{font-size:12px;color:var(--gray-lt);font-weight:600;margin-bottom:12px;}
  .tsw-list{display:flex;flex-direction:column;gap:8px;}
  .tsw-row{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;background:#fff;border:1px solid var(--border);
    border-radius:var(--r-md);box-shadow:0 1px 3px rgba(0,0,0,.05);transition:box-shadow .15s,transform .15s;cursor:pointer;}
  .tsw-row:hover{box-shadow:0 4px 14px rgba(0,0,0,.09);transform:translateY(-1px);}
  .tsw-row.done{opacity:.62;}
  .tsw-check{width:22px;height:22px;border-radius:50%;border:2px solid #d1d5db;background:#fff;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;padding:0;}
  .tsw-check.checked{background:var(--success);border-color:var(--success);}
  .tsw-check svg{display:none;}.tsw-check.checked svg{display:block;}
  .tsw-main{flex:1;min-width:0;padding-top:1px;}
  .tsw-row-title{font-size:14px;font-weight:600;line-height:1.45;}
  .tsw-row.done .tsw-row-title{color:var(--gray);text-decoration:line-through;}
  .tsw-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:6px;}
  .tsw-b{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:9.5px;font-weight:800;
    letter-spacing:.4px;text-transform:uppercase;line-height:1.5;}
  .tsw-b-cat{color:#fff;}.tsw-b-recur{background:rgba(var(--primary-rgb),.1);color:var(--primary);}
  .tsw-b-due{color:var(--gray-lt);font-weight:600;text-transform:none;letter-spacing:0;font-size:11px;}
  .tsw-b-due.overdue{color:var(--error);font-weight:800;}
  .tsw-b-prio{border:1.5px solid currentColor;font-size:9.5px;}
  .tsw-b-list{color:var(--gray);font-weight:600;text-transform:none;letter-spacing:0;font-size:11px;}
  /* modal */
  .tsw-overlay{position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;}
  .tsw-overlay.open{opacity:1;pointer-events:auto;}
  .tsw-detail{position:fixed;left:50%;top:50%;width:min(460px,92vw);max-height:min(86vh,760px);background:#fff;border-radius:20px;
    display:flex;flex-direction:column;overflow:hidden;z-index:99999;box-shadow:0 24px 64px rgba(0,0,0,.28);
    transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:opacity .2s,transform .26s cubic-bezier(.32,.72,0,1);}
  .tsw-detail.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
  .tsw-detail-head{display:flex;align-items:flex-start;gap:10px;padding:14px 20px 12px;flex-shrink:0;}
  .tsw-detail-badges{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center;}
  .tsw-detail-close{width:28px;height:28px;border-radius:50%;border:none;background:#f3f4f6;cursor:pointer;display:flex;
    align-items:center;justify-content:center;color:var(--gray);flex-shrink:0;}
  .tsw-detail-close:hover{background:var(--border);color:var(--dark);}
  .tsw-detail-body{flex:1;overflow-y:auto;padding:4px 20px 20px;min-height:0;}
  .tsw-detail-title{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:14px;}
  .tsw-detail-title.done{text-decoration:line-through;color:var(--gray);}
  .tsw-detail-meta{display:flex;flex-direction:column;gap:9px;margin-bottom:18px;}
  .tsw-mrow{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--gray);}
  .tsw-mrow svg{flex-shrink:0;color:var(--gray-lt);}
  .tsw-mrow.overdue{color:var(--error);font-weight:700;}.tsw-mrow.overdue svg{color:var(--error);}
  .tsw-lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gray-lt);margin-bottom:6px;}
  .tsw-desc{font-size:13px;color:var(--gray);line-height:1.65;}
  .tsw-att{margin-top:18px;}
  .tsw-att-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .tsw-att-tile{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-md);
    background:#fafafa;font-size:12px;color:var(--dark);text-decoration:none;}
  .tsw-att-ico{width:36px;height:36px;border-radius:var(--r-sm);background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:var(--gray-lt);}
  .tsw-att-name{font-weight:600;}.tsw-att-size{color:var(--gray-lt);font-size:11px;}
  .tsw-detail-foot{padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0;}
  .tsw-done-btn{width:100%;padding:13px;border-radius:var(--r-md);border:none;font-size:14px;font-weight:700;cursor:pointer;
    font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
  .tsw-done-btn.mark{background:rgba(var(--primary-rgb),.08);border:1.5px solid rgba(var(--primary-rgb),.2);color:var(--primary);}
  .tsw-done-btn.mark:hover{background:var(--primary);color:#fff;}
  .tsw-done-btn.reopen{background:#f3f4f6;border:1.5px solid var(--border);color:var(--gray);}
</style>
</head>
<body>
<div class="tsw">
  <div class="tsw-title">Your store checklist</div>
  <div class="tsw-count">3 tasks</div>
  <div class="tsw-list" id="list"></div>
</div>
<div class="tsw-overlay" id="ov"></div>
<div class="tsw-detail" id="modal">
  <div class="tsw-detail-head"><div class="tsw-detail-badges" id="d-badges"></div>
    <button class="tsw-detail-close" id="d-close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="tsw-detail-body" id="d-body"></div>
  <div class="tsw-detail-foot"><button class="tsw-done-btn" id="d-toggle"></button></div>
</div>
<script>
const CAT={compliance:"#8B4513",safety:"#D97706",storetask:"#da2e32"};
const IC={cal:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  store:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
  list:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  file:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  done:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  undo:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>'};
const TASKS=[
  {id:"t1", installId:"27048", title:"Field Consultant Visits: Preparing Your Store for Peak Excellence", type:"compliance", critical:true, status:"OPEN",
   due:"Overdue · Jul 4, 2026", overdue:true, created:"Jun 26, 2026", list:"Operations Tasks",
   desc:"Prepare the store for regular visits from the corporate Field Consultant or Franchise Owner by cleaning high-touch areas and ensuring 100% planogram compliance. This demonstrates excellent operational standards and leadership.",
   atts:[{name:"bc6f6220-403a-4948-…",size:"188 KB"}]},
  {id:"t2", installId:"27048", title:"Check walk-in freezer temperature log", type:"safety", status:"OPEN", due:"Due Aug 14", overdue:false, created:"Aug 7, 2026", list:"Compliance & Safety", desc:"Record temperature; flag if above -18°C.", atts:[]},
  {id:"t3", installId:"27048", title:"Unlock and disarm the store", type:"storetask", recur:true, status:"CLOSED", due:"Due Aug 14", overdue:false, created:"Aug 7, 2026", list:"Store Opening", desc:"", atts:[]},
];
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const byId=id=>document.getElementById(id);
let cur=null;
function badges(t){const o=[];if(t.type){const c=CAT[t.type]||"#6b7280";o.push(`<span class="tsw-b tsw-b-cat" style="background:${c}">${esc(t.type)}</span>`);}
  if(t.recur)o.push(`<span class="tsw-b tsw-b-recur">↻ Recurring</span>`);
  if(t.critical)o.push(`<span class="tsw-b tsw-b-prio" style="color:#9B1C2E">Critical</span>`);return o.join("");}
function renderList(){
  byId("list").innerHTML=TASKS.map(t=>{const done=t.status==="CLOSED";const m=[badges(t)];
    m.push(`<span class="tsw-b tsw-b-due ${t.overdue&&!done?"overdue":""}">${esc(t.due)}</span>`);
    m.push(`<span class="tsw-b tsw-b-list">${IC.list} ${esc(t.list)}</span>`);
    return `<div class="tsw-row ${done?"done":""}" data-id="${t.id}"><button class="tsw-check ${done?"checked":""}">${IC.check}</button>
      <div class="tsw-main"><span class="tsw-row-title">${esc(t.title)}</span><div class="tsw-meta">${m.join("")}</div></div></div>`;}).join("");
  byId("list").querySelectorAll(".tsw-row").forEach(row=>{const t=TASKS.find(x=>x.id===row.dataset.id);
    row.querySelector(".tsw-check").addEventListener("click",e=>{e.stopPropagation();toggle(t);});
    row.addEventListener("click",()=>open(t));});
}
function renderDetail(t){const done=t.status==="CLOSED";
  byId("d-badges").innerHTML=badges(t);
  byId("d-body").innerHTML=`
    <div class="tsw-detail-title ${done?"done":""}">${esc(t.title)}</div>
    <div class="tsw-detail-meta">
      <div class="tsw-mrow ${t.overdue&&!done?"overdue":""}">${IC.cal}${esc(t.due)}</div>
      <div class="tsw-mrow">${IC.clock}Created ${esc(t.created)}</div>
      <div class="tsw-mrow">${IC.store}Store ${esc(t.installId)}</div>
      <div class="tsw-mrow">${IC.list}${esc(t.list)}</div>
    </div>
    <div class="tsw-lbl">Description</div>
    ${t.desc?`<div class="tsw-desc">${esc(t.desc)}</div>`:`<div class="tsw-desc" style="font-style:italic">No description provided.</div>`}
    ${t.atts.length?`<div class="tsw-att"><div class="tsw-lbl">Attachments</div><div class="tsw-att-grid">${t.atts.map(a=>`<a class="tsw-att-tile" href="#" onclick="return false"><span class="tsw-att-ico">${IC.file}</span><span><span class="tsw-att-name">${esc(a.name)}</span><br><span class="tsw-att-size">${esc(a.size)}</span></span></a>`).join("")}</div></div>`:""}`;
  const b=byId("d-toggle");
  if(done){b.className="tsw-done-btn reopen";b.innerHTML=`${IC.undo} Reopen task`;}
  else{b.className="tsw-done-btn mark";b.innerHTML=`${IC.done} Mark as done`;}
}
function open(t){cur=t;renderDetail(t);byId("ov").classList.add("open");requestAnimationFrame(()=>byId("modal").classList.add("open"));}
function close(){byId("ov").classList.remove("open");byId("modal").classList.remove("open");cur=null;}
function toggle(t){t.status=t.status==="CLOSED"?"OPEN":"CLOSED";renderList();if(cur===t)renderDetail(t);}
byId("d-close").addEventListener("click",close);
byId("ov").addEventListener("click",close);
byId("d-toggle").addEventListener("click",()=>{if(cur)toggle(cur);});
renderList();
</script>
</body>
</html>
